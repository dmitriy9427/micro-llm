[package]
name = "microllm-bpe"
version = "0.1.0"
edition = "2021"
description = "Byte-level BPE tokenizer from micro-llm: training and encoding in Rust, usable from the browser through WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-gencat", "unicode-case", "perf"] }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
